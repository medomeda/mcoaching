# Déploiement : PostgreSQL + migrations + application.
#   cp .env.docker.example .env   (puis renseigner les valeurs)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcoaching}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-mcoaching}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Port exposé sur la machine locale uniquement (sauvegardes, outils) ; supprimer pour fermer tout accès.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcoaching}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mcoaching}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcoaching}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mcoaching}
      AUTH_SECRET: ${AUTH_SECRET:?Définir AUTH_SECRET dans .env (openssl rand -hex 32)}
      APP_URL: ${APP_URL:-http://localhost:3600}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Abidjan}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ACTIVATION_BY_EMAIL: ${ACTIVATION_BY_EMAIL:-false}
      # Une seule instance de l'application : le planificateur intégré peut rester actif.
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3600}:3600"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3600/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  storage-data:
